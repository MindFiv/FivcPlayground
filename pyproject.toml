[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fivcplayground"
dynamic = ["version"]
description = "Personal Simple Generic Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Charlie ZHANG", email = "sunnypig2002@gmail.com" }
]
dependencies = [
    # Core dependencies
    "typer>=0.12.3",
    "rich>=13.7.1",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "jambo>=0.1.0",
    "nest-asyncio>=1.6.0",
    # Transitive dependencies (required by other packages)
    "httpx>=0.28.1", # Required by: langgraph-sdk, langsmith, mcp, ollama, openai, python-fasthtml
    "openai>=1.109.1",
    "ollama>=0.6.0",
]

[project.optional-dependencies]
# ChromaDB embedding backend
chroma = [
    "chromadb>=1.1.0",
]

# Strands agent backend
strands = [
    "strands-agents",
    "strands-agents[openai]",
    "strands-agents[ollama]",
    "strands-agents[gemini]"
]

# Google ADK agent backend
adk = [
    "google-adk",
    "litellm"
]

# Pydantic AI agent backend
pydantic_ai = [
    "pydantic-ai-slim[openai,mcp]>=2.54,<3"
]

# All backends and embedding support
all = [
    "chromadb>=1.1.0",
    "google-adk",
    "litellm",
    "pydantic-ai-slim[openai,mcp]>=2.54,<3",
    "strands-agents",
    "strands-agents[openai]",
    "strands-agents[ollama]",
    "strands-agents[gemini]"
]

# Development dependencies
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.4.0,<0.6",
    "build>=1.0.0",
    "twine>=4.0.0",
    "taskipy>=1.12",
]

[project.scripts]
fivcplayground = "fivcplayground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "fivcplayground.__version__" }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
# Suppress specific deprecated warnings from third-party libraries
filterwarnings = [
    # Suppress all deprecation warnings (broad approach for cleaner test output)
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::RuntimeWarning",
    # Keep important warnings but suppress noisy third-party ones
    "default::UserWarning",
    "default::FutureWarning",
]

# Test discovery settings
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Additional pytest options
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
#    "-p", "no:warnings", # Disable warnings plugin
]

# Markers for test categorization
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]

[tool.taskipy.tasks]
install = { cmd = "uv sync --extra all --extra dev", help = "Install all dependencies" }
install-min = { cmd = "uv sync", help = "Install minimal runtime dependencies" }
dev = { cmd = "task install", help = "Install development dependencies" }
format = { cmd = "uv run ruff format src tests", help = "Format code with Ruff" }
lint = { cmd = "uv run ruff check src tests", help = "Run Ruff linting" }
check = { cmd = "task format && task lint", help = "Run all code quality checks" }
test = { cmd = "uv run python -m pytest -q", help = "Run tests with pytest" }
test-cov = { cmd = "uv run python -m pytest --cov=src/fivcplayground --cov-report=term-missing", help = "Run tests with coverage" }
clean = { cmd = "uv run python scripts/clean_caches.py", help = "Remove build and cache artifacts" }
build = { cmd = "task clean && task dev && uv run python -m build", help = "Build wheel and source distributions" }
publish = { cmd = "task build && uv run python -m twine upload dist/*", help = "Build and publish to PyPI" }
sample = { cmd = "uv run fivcplayground run Generic --query \"What is machine learning?\" --dry-run", help = "Run the sample agent in dry-run mode" }
info = { cmd = "uv run fivcplayground info", help = "Show system information" }
all = { cmd = "task install && task check && task test", help = "Run the full development workflow" }
